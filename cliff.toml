# git-cliff configuration
# Docs: https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/),
and this project adheres to [Semantic Versioning](https://semver.org/).
"""
body = """
{% if version -%}
## {{ version }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## Unreleased
{% endif %}
{% for group_key, group_commits in commits | group_by(attribute="group") %}
### {{ group_key | split(pat="~") | last }}
{% for commit in group_commits %}
- {% if commit.scope %}**({{ commit.scope }})** {% endif %}\
{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = true
tag_pattern = "[0-9].*"
sort_commits = "oldest"
topo_order = false

commit_parsers = [
    { message = "^feat", group = "01~✨ Features" },
    { message = "^fix", group = "02~🐛 Bug Fixes" },
    { message = "^security", group = "03~🔒 Security" },
    { message = "^perf", group = "04~⚡ Performance" },
    { message = "^docs", group = "05~📚 Documentation" },
    { message = "^refactor", skip = true },
    { message = "^test", skip = true },
    { message = "^chore", skip = true },
    { message = "^style", skip = true },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
