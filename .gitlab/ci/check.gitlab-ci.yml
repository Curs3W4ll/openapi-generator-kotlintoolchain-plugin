---

check:
  stage: check
  needs:
    - job: build
      artifacts: false
  extends:
    - .default-retry
    - .default-before_script
    - .interruptible
  cache:
    - !reference [".mise-cache", cache]
    - !reference [".kotlin-cache", cache]
  rules:
    - !reference [".if-merge-request", rules]
    - !reference [".if-default-branch", rules]
    - !reference [".if-release", rules]
  script:
    - ./kotlin check
