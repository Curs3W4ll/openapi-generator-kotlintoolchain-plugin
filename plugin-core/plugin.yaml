---
tasks:
  generateOpenAPI:
    action: !io.gitlab.curs3w4ll.openapi.generator.kotlintoolchain.plugin.openApiGenerate
      inputSpec: ${pluginSettings.inputSpec}
      inputSpecsDirectory: ${pluginSettings.inputSpecsDirectory}
      remoteInputSpec: ${pluginSettings.remoteInputSpec}
      auth: ${pluginSettings.auth}
      httpUserAgent: ${pluginSettings.httpUserAgent}
      configFile: ${pluginSettings.configFile}
      # TODO: #46 Use only one @Output Path once the Kotlin Toolchain supports it
      kotlinMainSourcesDir: ${taskOutputDir}/src/main/kotlin
      kotlinTestSourcesDir: ${taskOutputDir}/src/test/kotlin
      javaMainSourcesDir: ${taskOutputDir}/src/main/java
      javaTestSourcesDir: ${taskOutputDir}/src/test/java
      generatorName: ${pluginSettings.generatorName}
      verbose: ${pluginSettings.verbose}
      logToStderr: ${pluginSettings.logToStderr}
      dryRun: ${pluginSettings.dryRun}
      validateSpec: ${pluginSettings.validateSpec}
      skipValidateSpec: ${pluginSettings.skipValidateSpec}
      cleanupOutput: ${pluginSettings.cleanupOutput}
      skipOverwrite: ${pluginSettings.skipOverwrite}
      globalProperties: ${pluginSettings.globalProperties}
      configOptions: ${pluginSettings.configOptions}
      additionalProperties: ${pluginSettings.additionalProperties}
      packageName: ${pluginSettings.packageName}
      apiPackage: ${pluginSettings.apiPackage}
      modelPackage: ${pluginSettings.modelPackage}
      invokerPackage: ${pluginSettings.invokerPackage}
      modelNamePrefix: ${pluginSettings.modelNamePrefix}
      modelNameSuffix: ${pluginSettings.modelNameSuffix}
      apiNameSuffix: ${pluginSettings.apiNameSuffix}
      groupId: ${pluginSettings.groupId}
      id: ${pluginSettings.id}
      version: ${pluginSettings.version}
      library: ${pluginSettings.library}
      gitHost: ${pluginSettings.gitHost}
      gitUserId: ${pluginSettings.gitUserId}
      gitRepoId: ${pluginSettings.gitRepoId}
      releaseNote: ${pluginSettings.releaseNote}
      typeMappings: ${pluginSettings.typeMappings}
      instantiationTypes: ${pluginSettings.instantiationTypes}
      importMappings: ${pluginSettings.importMappings}
      languageSpecificPrimitives: ${pluginSettings.languageSpecificPrimitives}
      nameMappings: ${pluginSettings.nameMappings}
      parameterNameMappings: ${pluginSettings.parameterNameMappings}
      modelNameMappings: ${pluginSettings.modelNameMappings}
      enumNameMappings: ${pluginSettings.enumNameMappings}
      operationIdNameMappings: ${pluginSettings.operationIdNameMappings}
      schemaMappings: ${pluginSettings.schemaMappings}
      inlineSchemaNameMappings: ${pluginSettings.inlineSchemaNameMappings}
      inlineSchemaOptions: ${pluginSettings.inlineSchemaOptions}
      reservedWordsMappings: ${pluginSettings.reservedWordsMappings}
      serverVariables: ${pluginSettings.serverVariables}
      openapiNormalizer: ${pluginSettings.openapiNormalizer}
      removeOperationIdPrefix: ${pluginSettings.removeOperationIdPrefix}
      skipOperationExample: ${pluginSettings.skipOperationExample}
      enablePostProcessFile: ${pluginSettings.enablePostProcessFile}
      templateDir: ${pluginSettings.templateDir}
      templateEngine: ${pluginSettings.templateEngine}

generated:
  sources:
    # TODO: #46 Use dynamic directory computing once the Kotlin Toolchain supports it
    # e.g. ${tasks.generateOpenAPI.action.outputDir}/src/main/kotlin/
    - language: kotlin
      directory: ${tasks.generateOpenAPI.action.kotlinMainSourcesDir}
    - language: kotlin
      directory: ${tasks.generateOpenAPI.action.kotlinTestSourcesDir}
      fragment:
        isTest: true
    - language: java
      directory: ${tasks.generateOpenAPI.action.javaMainSourcesDir}
    - language: java
      directory: ${tasks.generateOpenAPI.action.javaTestSourcesDir}
      fragment:
        isTest: true
