[tools]
java = "corretto-21"
pre-commit = "4.5.0"
markdownlint-cli2 = "0.18.0"
actionlint = "1.7.12"
ktlint = "1.8.0"
pipx = "1.12.0"
"pipx:yamllint" = "1.38.0"

[settings]
experimental = true

[hooks]
enter = [
    "mise i -q",
    { task = "pre-commit:setup" },
]

[tasks."pre-commit:setup"]
description = "Setup Git hooks with pre-commit"
run = "pre-commit install"
sources = [".pre-commit-config.yaml"]