---
openapi: 3.0.3
info:
  title: ServerVariables and Mappings test API
  version: 0.0.1

servers:
  - url: "{scheme}://api.example.com"
    variables:
      scheme:
        default: http
        enum:
          - http
          - https

components:
  schemas:
    PostDto:
      description: >-
        A blog post with a reserved-word property to test reservedWordsMappings
      type: object
      properties:
        id:
          type: integer
          format: int64
        return:
          description: Return policy — named 'return' to test reservedWordsMappings
          type: string

paths:
  /posts/{id}:
    get:
      operationId: getPost
      summary: Get a post by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The post matching the id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDto'
