---
openapi: 3.0.3
info:
  title: JSONPlaceholder
  version: 0.0.1
  description: Public test API used to validate request wiring end-to-end

servers:
  - url: https://jsonplaceholder.typicode.com
    description: JSONPlaceholder public test endpoint

components:
  schemas:
    PostDto:
      description: A blog post returned by JSONPlaceholder
      type: object
      required:
        - id
        - userId
        - title
        - body
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        title:
          type: string
        body:
          type: string

paths:
  /posts/{id}:
    get:
      operationId: getPost
      summary: Fetch a post by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The post matching the id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDto'
