---
product: jvm/app

plugins:
  openapi-generator:
    enabled: true
    generatorName: kotlin
    inputSpec: "resources/openapi/test-api.yml"
    ignoreFileOverride: "resources/openapi-generator-ignore"
    openapiGeneratorIgnoreList:
      - "**/IgnoredFromListDto.kt"
    globalProperties:
      apiTests: "false"
      modelTests: "false"

dependencies:
  - com.squareup.okhttp3:okhttp:4.12.0
  - com.squareup.moshi:moshi-kotlin:1.15.2

test-dependencies:
  - io.kotlintest:kotlintest-runner-junit5:3.4.2

settings:
  jvm:
    jdk:
      version: 21
      distributions: [corretto]
    mainClass: openapigeneratorignore.ApplicationKt
  kotlin:
    version: 2.3.20

description: >-
  Test project to verify that ignoreFileOverride and openapiGeneratorIgnoreList exclude
  matching files from generation — models referenced by the ignore patterns must be absent
  from the runtime classpath while models not in the ignore list remain generated
