---
openapi: 3.0.3
info:
  title: OpenAPI Generator Ignore Test API
  version: 0.0.1
  description: Minimal spec used to exercise ignoreFileOverride and openapiGeneratorIgnoreList

components:
  schemas:
    PostDto:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int64
    IgnoredFromFileDto:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    IgnoredFromListDto:
      type: object
      required:
        - tag
      properties:
        tag:
          type: string

paths:
  /posts/{id}:
    get:
      operationId: getPost
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The post matching the id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDto'
