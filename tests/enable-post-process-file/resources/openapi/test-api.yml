---
openapi: 3.0.3
info:
  title: EnablePostProcessFile test API
  version: 0.0.1

servers:
  - url: https://example.com

components:
  schemas:
    PostDto:
      type: object
      required:
        - id
        - title
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string

paths:
  /posts/{id}:
    get:
      operationId: getPost
      summary: Fetch a post by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The post matching the id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDto'
