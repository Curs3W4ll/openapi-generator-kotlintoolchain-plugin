---
product: jvm/app

plugins:
  openapi-generator:
    enabled: true
    generatorName: java
    inputSpec: "resources/openapi/test-api.yml"
    invokerPackage: gencontrols.test
    apiPackage: gencontrols.test.api
    modelPackage: gencontrols.test.model
    configOptions:
      library: native
      openApiNullable: "false"

dependencies:
  - com.fasterxml.jackson.core:jackson-databind:2.17.2
  - com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.2
  - com.google.code.findbugs:jsr305:3.0.2
  - javax.annotation:javax.annotation-api:1.3.2

settings:
  jvm:
    jdk:
      version: 21
      distributions: [corretto]
    mainClass: gencontrols.ApplicationKt
  kotlin:
    version: 2.3.20

description: >-
  Test project to verify Java main and test sources generated by a Java generator
  are correctly registered as separate source sets: main sources compile alongside
  Kotlin code, and generated test files (which import JUnit) compile only in test scope
