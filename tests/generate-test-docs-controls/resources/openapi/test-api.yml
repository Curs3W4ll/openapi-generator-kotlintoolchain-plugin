---
openapi: 3.0.3
info:
  title: Generate test/docs controls test API
  version: 0.0.1

components:
  schemas:
    PostDto:
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          enum:
            - active
            - inactive

paths:
  /posts:
    get:
      operationId: listPosts
      summary: List all posts
      responses:
        '200':
          description: List of posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PostDto'
