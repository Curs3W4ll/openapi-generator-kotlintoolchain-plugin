---
product: jvm/app

plugins:
  openapi-generator:
    enabled: true
    generatorName: kotlin
    remoteInputSpec: "https://petstore3.swagger.io/api/v3/openapi.json"

dependencies:
  - com.squareup.okhttp3:okhttp:4.12.0
  - com.squareup.moshi:moshi-kotlin:1.15.2
  - ch.qos.logback:logback-classic:1.5.18

test-dependencies:
  - io.kotlintest:kotlintest-runner-junit5:3.4.2

settings:
  jvm:
    jdk:
      version: 21
      distributions: [corretto]
    mainClass: remote.input.spec.ApplicationKt
  kotlin:
    version: 2.3.20

description: Test project to ensure the plugin can generate code from a remote OpenAPI spec URL
