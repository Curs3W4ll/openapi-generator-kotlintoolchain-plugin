---
product: jvm/app

plugins:
  openapi-generator:
    enabled: true
    generatorName: kotlin
    inputSpec: "resources/openapi/test-api.yml"
    packageName: suppresstestgen.test
    globalProperties:
      apiTests: "false"
      modelTests: "false"

dependencies:
  - com.squareup.okhttp3:okhttp:4.12.0
  - com.squareup.moshi:moshi-kotlin:1.15.2

settings:
  jvm:
    jdk:
      version: 21
      distributions: [corretto]
    mainClass: suppresstestgen.ApplicationKt
  kotlin:
    version: 2.3.20

description: >-
  Test project to verify the plugin works correctly when test file generation is
  explicitly disabled — the Kotlin test source set is empty but the module still
  compiles and generated main sources are accessible
