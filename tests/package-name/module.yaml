---
product: jvm/app

plugins:
  openapi-generator:
    enabled: true
    generatorName: kotlin
    inputSpec: "resources/openapi/test-api.yml"
    packageName: pkgbase.test

dependencies:
  - com.squareup.okhttp3:okhttp:4.12.0
  - com.squareup.moshi:moshi-kotlin:1.15.2

test-dependencies:
  - io.kotlintest:kotlintest-runner-junit5:3.4.2

settings:
  jvm:
    jdk:
      version: 21
      distributions: [corretto]
    mainClass: pkgbase.ApplicationKt
  kotlin:
    version: 2.3.20

description: Test project to verify packageName setting is applied by the generator
