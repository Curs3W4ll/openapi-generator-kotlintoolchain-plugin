---
product: jvm/app

plugins:
  openapi-generator:
    enabled: true
    generatorName: java
    inputSpec: "resources/openapi/test-api.yml"
    invokerPackage: schemamappings.test
    apiPackage: schemamappings.test.api
    modelPackage: schemamappings.test.model
    schemaMappings:
      PostDto: java.lang.String
    inlineSchemaNameMappings:
      listPosts_200_response: PostCollection
    inlineSchemaOptions:
      RESOLVE_INLINE_ENUMS: "true"
    configOptions:
      library: native
      openApiNullable: "false"

dependencies:
  - com.fasterxml.jackson.core:jackson-databind:2.17.2
  - com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.2
  - com.google.code.findbugs:jsr305:3.0.2
  - javax.annotation:javax.annotation-api:1.3.2

settings:
  jvm:
    jdk:
      version: 21
      distributions: [corretto]
    mainClass: schemamappings.ApplicationKt
  kotlin:
    version: 2.3.20

description: >-
  Test project to verify schemaMappings, inlineSchemaNameMappings,
  and inlineSchemaOptions settings
