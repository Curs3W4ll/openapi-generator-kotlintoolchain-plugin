---
openapi: 3.0.3
info:
  title: SchemaMappings test API
  version: 0.0.1

servers:
  - url: https://example.com

components:
  schemas:
    PostDto:
      description: A blog post — mapped away via schemaMappings to test schema substitution
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string

paths:
  /posts/{id}:
    get:
      operationId: getPost
      summary: Get a post by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The post matching the id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDto'
  /posts:
    get:
      operationId: listPosts
      summary: List all posts
      responses:
        '200':
          description: List of posts
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: integer
