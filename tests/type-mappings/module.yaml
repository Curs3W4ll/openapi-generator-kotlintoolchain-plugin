---
product: jvm/app

plugins:
  openapi-generator:
    enabled: true
    generatorName: java
    inputSpec: "resources/openapi/test-api.yml"
    invokerPackage: typemappings.test
    apiPackage: typemappings.test.api
    modelPackage: typemappings.test.model
    typeMappings:
      DateTime: Instant
    importMappings:
      Instant: java.time.Instant
    languageSpecificPrimitives:
      - PostLabel
    instantiationTypes:
      array: java.util.LinkedList
    configOptions:
      library: native
      openApiNullable: "false"

dependencies:
  - com.fasterxml.jackson.core:jackson-databind:2.17.2
  - com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.2
  - com.google.code.findbugs:jsr305:3.0.2
  - javax.annotation:javax.annotation-api:1.3.2

settings:
  jvm:
    jdk:
      version: 21
      distributions: [corretto]
    mainClass: typemappings.ApplicationKt
  kotlin:
    version: 2.3.20

description: >-
  Test project to verify typeMappings, instantiationTypes, importMappings,
  and languageSpecificPrimitives settings
